name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Sprites are never committed (ADR-018): every build fetches them with tools/fetch-data.
      # The cache keeps the raw PokéAPI responses (species, names, moves) and the sprites between
      # runs, so a warm build makes no network request at all. A cold one downloads about 430
      # responses, spaced by 700 ms (about 7 minutes), once. The key depends only on what decides
      # WHICH responses are needed (the roster and the hand-made move table), not on the tool's
      # code, and `restore-keys` starts from the closest older cache: adding a species downloads
      # only the new ones. Raw responses are keyed by URL, so changing how they are parsed never
      # downloads anything.
      - uses: actions/cache@v4
        with:
          path: |
            tools/fetch-data/.cache
            src/assets/sprites
          key: fetch-data-${{ hashFiles('tools/fetch-data/roster.json', 'tools/fetch-data/moves-overrides.json') }}
          restore-keys: |
            fetch-data-
      - run: pnpm fetch-data
      # The committed species.json must be exactly what the tool generates.
      - run: git diff --exit-code -- src/data/generated
      - run: pnpm build
