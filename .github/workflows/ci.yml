name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Sprites are never committed (ADR-018): every build fetches them with tools/fetch-data.
      # The cache keeps raw PokéAPI responses and the sprites between runs, so a warm build makes
      # no network request at all; the key changes only when the roster or the tool changes.
      - uses: actions/cache@v4
        with:
          path: |
            tools/fetch-data/.cache
            src/assets/sprites
          key: fetch-data-${{ hashFiles('tools/fetch-data/roster.json', 'tools/fetch-data/*.ts') }}
      - run: pnpm fetch-data
      # The committed species.json must be exactly what the tool generates.
      - run: git diff --exit-code -- src/data/generated
      - run: pnpm build
